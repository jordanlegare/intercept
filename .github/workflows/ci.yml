name: Rust CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format source
        run: cargo fmt --all
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check browser script syntax
        run: |
          node --check web/controller.js
          node --check web/authority.js
          node --check extension/firefox/background.js
          node --check extension/firefox/popup.js
          node --check extension/firefox/worker_probe.js
          node --check extension/firefox/video_download.js
          node --check extension/firefox/download_bridge.js
          node -e 'const fs=require("node:fs"); const m=JSON.parse(fs.readFileSync("extension/firefox/manifest.json","utf8")); if(!m.permissions.includes("scripting")) throw new Error("Missing scripting permission"); if(!m.content_scripts || !m.content_scripts.some(s=>s.world==="MAIN" && s.run_at==="document_start" && s.js.includes("worker_probe.js") && s.matches.includes("http://localhost/*") && s.matches.includes("http://*.localhost/*") && s.matches.includes("http://127.0.0.1/*") && !s.matches.some(x=>/^http:\/\/[^/]*:\d+\//.test(x)))) throw new Error("Invalid localhost worker-probe match patterns"); if(!["http://localhost/*","http://*.localhost/*","http://127.0.0.1/*"].every(x=>m.host_permissions.includes(x)) || m.host_permissions.some(x=>/^http:\/\/[^/]*:\d+\//.test(x))) throw new Error("Invalid localhost host permissions"); const w=fs.readFileSync("extension/firefox/worker_probe.js","utf8"); for(const token of ["isNativeYouTube","isInterceptProxy","location.port === \"5000\""]) if(!w.includes(token)) throw new Error("Missing worker-probe origin guard: "+token); const b=fs.readFileSync("extension/firefox/background.js","utf8"); for(const token of ["MEDIA_TRACE_URL_FILTERS","classifyMediaRequest","recordMediaRequestStart","recordMediaRequestComplete","intercept-media-trace:start","media_requests_started"]) if(!b.includes(token)) throw new Error("Missing browser media trace diagnostic: "+token); const p=fs.readFileSync("extension/firefox/popup.js","utf8"); for(const token of ["getRegistrations","worker_resource_timing","document_performance_resource_entries","__interceptWorkerProbeV1"]) if(!p.includes(token)) throw new Error("Missing environment diagnostic: "+token); for(const token of ["videoDiagnostics","buffered_ranges","worker_start_nonzero_entries","media_request_observation"]) if(!p.includes(token)) throw new Error("Missing page playback diagnostic: "+token); if(m.browser_specific_settings.gecko.strict_min_version!=="128.0") throw new Error("Unexpected Firefox minimum version"); const html=fs.readFileSync("extension/firefox/popup.html","utf8"); for(const id of ["capture-env","export-comparison","compare-status","differences","start-media-trace","refresh-media-trace","stop-media-trace","export-media-trace","media-trace-status"]) if(!html.includes("id=\""+id+"\"")) throw new Error("Missing popup control: "+id);'
          node -e 'const fs=require("node:fs"); const html=fs.readFileSync("web/index.html","utf8"); const open=html.indexOf("<script"); const start=open < 0 ? -1 : html.indexOf(">",open)+1; const end=start > 0 ? html.indexOf("</script>",start) : -1; if (start <= 0 || end < start) throw new Error("No inline dashboard script found"); fs.writeFileSync("/tmp/intercept-dashboard-inline.js",html.slice(start,end));'
          node --check /tmp/intercept-dashboard-inline.js
          node -e 'const fs=require("node:fs"); const m=JSON.parse(fs.readFileSync("extension/firefox/manifest.json","utf8")); if(!m.permissions.includes("alarms")) throw new Error("Missing Firefox alarms permission"); const b=fs.readFileSync("extension/firefox/background.js","utf8"); for(const token of ["NATIVE_HEARTBEAT_ALARM","browser.alarms.onAlarm.addListener","native_session_heartbeat","configureNativeHeartbeat"]) if(!b.includes(token)) throw new Error("Missing native session heartbeat behavior: "+token); const r=fs.readFileSync("src/main.rs","utf8"); for(const token of ["native_session_heartbeat","native_last_seen_ago_ms","WAITING FOR EXTENSION","CONNECTED","STALE"]) if(!r.includes(token)) throw new Error("Missing native session dashboard status: "+token); const h=fs.readFileSync("web/index.html","utf8"); for(const token of ["activity-dialog","openNativeActivity","native_last_seen_ago_ms","HTTP CACHE N/A (TLS PASSTHROUGH)"]) if(!h.includes(token)) throw new Error("Missing native session dashboard control: "+token);'
      - name: Check native playback download feature
        run: |
          node -e 'const fs=require("node:fs"); const m=JSON.parse(fs.readFileSync("extension/firefox/manifest.json","utf8")); if(m.version!=="0.4.2") throw new Error("Unexpected Firefox extension version"); if(!m.permissions.includes("downloads")) throw new Error("Missing Firefox downloads permission"); if(!m.content_scripts.some(s=>s.world==="MAIN" && s.run_at==="document_start" && s.js.includes("video_download.js"))) throw new Error("Missing main-world playback capture script"); if(!m.content_scripts.some(s=>s.world==="ISOLATED" && s.run_at==="document_start" && s.js.includes("download_bridge.js"))) throw new Error("Missing isolated download bridge"); const d=fs.readFileSync("extension/firefox/video_download.js","utf8"); for(const token of ["__interceptPlaybackDownloadV1","captureStream","MediaRecorder","getDirectory","download_started","stopCapture"]) if(!d.includes(token)) throw new Error("Missing playback download behavior: "+token); const b=fs.readFileSync("extension/firefox/download_bridge.js","utf8"); for(const token of ["browser.runtime.connect","intercept-playback-download:request","playback-download:started"]) if(!b.includes(token)) throw new Error("Missing isolated download bridge: "+token); const bg=fs.readFileSync("extension/firefox/background.js","utf8"); for(const token of ["browser.runtime.onConnect.addListener","browser.downloads.download","playbackDownloadJobs","session.downloadEnabled"]) if(!bg.includes(token)) throw new Error("Missing background download job: "+token); const d2=fs.readFileSync("extension/firefox/video_download.js","utf8"); for(const token of ["requestBrowserDownload","intercept-playback-download:result","preparationFinished"]) if(!d2.includes(token)) throw new Error("Missing playback download handling: "+token); const p=fs.readFileSync("extension/firefox/popup.js","utf8"); for(const token of ["download-toggle","setPlaybackDownloadEnabled","executePlaybackDownloadCommand"]) if(!p.includes(token)) throw new Error("Missing playback download toggle: "+token); const h=fs.readFileSync("extension/firefox/popup.html","utf8"); for(const token of ["download-toggle","DOWNLOAD WHEN VIDEO COMPLETES","download-status"]) if(!h.includes(token)) throw new Error("Missing playback download markup: "+token);'
      - name: Test
        run: cargo test --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

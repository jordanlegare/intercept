name: Rust CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format source
        run: cargo fmt --all
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check browser script syntax
        run: |
          node --check web/controller.js
          node --check web/authority.js
          node -e 'const fs=require("node:fs"); const html=fs.readFileSync("web/index.html","utf8"); const scripts=[...html.matchAll(/<script\\b[^>]*>([\\s\\S]*?)<\\/script\\s*>/gi)]; if (!scripts.length) throw new Error("No inline dashboard script found"); fs.writeFileSync("/tmp/intercept-dashboard-inline.js", scripts.map(match => match[1]).join("\\n"));'
          node --check /tmp/intercept-dashboard-inline.js
      - name: Test
        run: cargo test --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

[package]
name = "intercept-proxy"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A loopback browser proxy with timed authorization for state-changing HTTP requests"
license = "Unlicense"

[[bin]]
name = "intercept"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
bytes = "1"
futures-util = "0.3"
http = "1"
lol_html = "3.0.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "charset", "json", "stream", "gzip", "brotli", "zstd", "deflate", "cookies"] }
cookie_store = { version = "0.21.1", default-features = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
regex = "1"
uuid = { version = "1", features = ["v4"] }
sha1 = "0.10"

[dev-dependencies]

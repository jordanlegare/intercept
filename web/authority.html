<!doctype html>
<html lang="en" data-session="__SESSION_ID__">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Intercept Authority</title>
  <style>
    :root{font:12px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;color:#e9f2ff;background:#080e16}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;min-height:100%;background:#080e16}
    main{width:100%;padding:9px 14px;background:rgba(8,14,23,.98);border-top:1px solid #4b7197;box-shadow:0 -8px 32px #0005}
    .row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px 14px}
    strong{color:#8ed9ff;letter-spacing:.14em}
    #state{color:#ffe09a;font-weight:700}
    label{color:#a8bad0}
    input{width:104px;padding:7px 8px;color:#f5f9ff;background:#111d2c;border:1px solid #45617f;border-radius:2px;font:inherit}
    button{padding:8px 18px;color:#06111b;background:#8ed9ff;border:0;border-radius:2px;font:800 12px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.12em;cursor:pointer}
    button:disabled{opacity:.45;cursor:not-allowed}
    #countdown{min-width:86px;color:#8ed9ff;font-weight:700}
    #notice{margin-top:6px;color:#a9bad0;text-align:center;font-size:10px}
    details{margin:7px auto 0;max-width:1080px}
    summary{color:#9cc7e8;cursor:pointer;text-align:center;user-select:none}
    #events{max-height:120px;overflow:auto;margin:7px 0 0;padding:8px;color:#b8c8dc;background:#070c13;border:1px solid #26394f;white-space:pre-wrap;overflow-wrap:anywhere;font:10px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace}
    #metrics{margin-top:5px;color:#758ba5;text-align:center;font-size:9px}
    @media(max-width:520px){main{padding:7px}.row{gap:7px 9px}strong{flex-basis:100%;text-align:center}#notice{font-size:9px}}
  </style>
  <script src="/assets/authority.js" defer></script>
</head>
<body>
  <main aria-label="Intercept authority controls">
    <div class="row">
      <strong>INTERCEPT AUTHORITY</strong>
      <span id="state" aria-live="polite">CONNECTING</span>
      <label for="delay">DELAY (SECONDS)</label>
      <input id="delay" type="number" min="0.000000001" max="86400" step="any" value="30" inputmode="decimal">
      <button id="start" type="button">[START]</button>
      <span id="countdown">SYNCING…</span>
    </div>
    <div id="notice" role="status">Waiting for the local authorization service.</div>
    <details id="event-panel">
      <summary id="event-summary">EVENT STREAM · connecting</summary>
      <pre id="events">Waiting for browser and upstream request events…</pre>
      <div id="metrics">Resource metrics unavailable until connected.</div>
    </details>
  </main>
</body>
</html>

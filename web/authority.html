<!doctype html>
<html lang="en" data-session="__SESSION_ID__">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Intercept Authority</title>
  <style>
    :root{font:12px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;color:#e9f2ff;background:#080e16}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;min-height:0;background:#080e16;overflow:hidden}
    body{height:100%;min-height:0}
    main{display:flex;flex-direction:column;width:100%;height:100%;min-height:0;padding:9px 14px;background:rgba(8,14,23,.99);border-top:1px solid #4b7197;box-shadow:0 -8px 32px #0005;overflow:hidden}
    .row{display:flex;flex:0 0 auto;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px 14px}
    strong{color:#8ed9ff;letter-spacing:.14em}
    #state{color:#ffe09a;font-weight:700}
    label{color:#a8bad0}
    input{width:104px;padding:7px 8px;color:#f5f9ff;background:#111d2c;border:1px solid #45617f;border-radius:2px;font:inherit}
    button{padding:8px 14px;color:#06111b;background:#8ed9ff;border:0;border-radius:2px;font:800 11px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.08em;cursor:pointer}
    button:disabled{opacity:.45;cursor:not-allowed}
    #countdown{min-width:86px;color:#8ed9ff;font-weight:700}
    #notice{flex:0 0 auto;margin-top:6px;color:#a9bad0;text-align:center;font-size:10px}
    details{display:flex;flex:1 1 auto;flex-direction:column;min-height:0;margin:7px auto 0;width:100%;max-width:none}
    summary{flex:0 0 auto;color:#9cc7e8;cursor:pointer;text-align:center;user-select:none}
    .event-actions{display:flex;flex:0 0 auto;align-items:center;justify-content:flex-end;gap:10px;margin:6px 0 0}
    #event-export-status{color:#758ba5;font-size:9px;text-align:right}
    #export-events{padding:6px 10px;font-size:10px}
    #export-events:focus-visible{outline:1px solid #fff;outline-offset:2px}
    #events{flex:1 1 auto;min-height:0;max-height:none;overflow:auto;margin:7px 0 0;padding:8px;color:#b8c8dc;background:#070c13;border:1px solid #26394f;white-space:pre-wrap;overflow-wrap:anywhere;font:10px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace}
    #metrics{flex:0 0 auto;margin-top:5px;color:#758ba5;text-align:center;font-size:9px}
    @media(max-width:520px){main{padding:7px}.row{gap:7px 9px}strong{flex-basis:100%;text-align:center}#notice{font-size:9px}button{padding:7px 9px}}
  </style>
  <script src="/assets/authority.js" defer></script>
</head>
<body>
  <main aria-label="Intercept authority controls">
    <div class="row">
      <strong>INTERCEPT AUTHORITY</strong>
      <span id="state" aria-live="polite">CONNECTING</span>
      <label for="delay">DELAY (SECONDS)</label>
      <input id="delay" type="number" min="0.000000001" max="86400" step="any" value="30" inputmode="decimal">
      <button id="start" type="button">[START]</button>
      <span id="countdown">SYNCING…</span>
      <button id="resize-panel" type="button" aria-expanded="false" aria-label="Expand authority panel to half the screen">[EXPAND ▲]</button>
    </div>
    <div id="notice" role="status">Waiting for the local authorization service.</div>
    <details id="event-panel">
      <summary id="event-summary">EVENT STREAM · connecting</summary>
      <div class="event-actions">
        <span id="event-export-status" role="status" aria-live="polite">Waiting for event history…</span>
        <button id="export-events" type="button" disabled title="Download all retained session events as JSON">[EXPORT JSON]</button>
      </div>
      <pre id="events">Waiting for browser and upstream request events…</pre>
      <div id="metrics">Resource metrics unavailable until connected.</div>
    </details>
  </main>
</body>
</html>
